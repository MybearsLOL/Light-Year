<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Game</title>
<!--
Changes made:
- added a rotating white outline planet in the bottom right corner
- loading bar and text are still in the middle
- every chunk of the files that downloads is shown as hex code, like a hacker screen
- added a giant text at the top that says which device you are on
- kept the file list, the engine log and the browser check
Files must be lowercase: index.js, index.wasm, index.pck
-->
<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background: #000;
	overflow: hidden;
	font-family: 'Courier New', monospace;
	color: #fff;
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
}
#loader {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #000;
	padding: 20px;
	box-sizing: border-box;
	overflow: hidden;
}
#hack {
	position: absolute;
	inset: 0;
	padding: 10px;
	box-sizing: border-box;
	overflow: hidden;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	font-size: 12px;
	line-height: 1.35;
	color: #1fbf4a;
	opacity: 0.35;
	white-space: pre;
	pointer-events: none;
}
#device {
	position: absolute;
	top: 3%;
	left: 0;
	width: 100%;
	text-align: center;
	font-size: clamp(48px, 14vw, 180px);
	font-weight: bold;
	letter-spacing: 0.05em;
	color: #fff;
	opacity: 0.9;
	text-shadow: 0 0 20px #4da3ff;
	pointer-events: none;
}
#deviceinfo {
	position: absolute;
	top: calc(3% + clamp(60px, 17vw, 210px));
	left: 0;
	width: 100%;
	text-align: center;
	font-size: clamp(12px, 2vw, 18px);
	color: #4da3ff;
	pointer-events: none;
}
#center {
	position: relative;
	z-index: 2;
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	background: rgba(0, 0, 0, 0.7);
	padding: 20px 0;
}
#title {
	font-size: 24px;
	margin-bottom: 16px;
}
#bar {
	width: min(500px, 90%);
	height: 16px;
	background: #333;
	border-radius: 8px;
	overflow: hidden;
}
#fill {
	width: 0%;
	height: 100%;
	background: #4da3ff;
	transition: width 0.1s;
}
#percent {
	margin-top: 10px;
	font-size: 18px;
}
#files {
	margin-top: 16px;
	width: min(500px, 90%);
	font-size: 14px;
}
.row {
	display: flex;
	justify-content: space-between;
	padding: 3px 0;
	border-bottom: 1px solid #222;
}
.row.done {
	color: #6fdc6f;
}
#log {
	margin-top: 16px;
	width: min(500px, 90%);
	max-height: 120px;
	overflow: auto;
	font-size: 12px;
	color: #aaa;
	white-space: pre-wrap;
}
#log .err {
	color: #ff6b6b;
}
#planet {
	position: absolute;
	right: 20px;
	bottom: 20px;
	width: 160px;
	height: 160px;
	z-index: 3;
	pointer-events: none;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loader">
	<div id="hack"></div>
	<div id="device">...</div>
	<div id="deviceinfo"></div>
	<div id="center">
		<div id="title">Loading game...</div>
		<div id="bar"><div id="fill"></div></div>
		<div id="percent">0%</div>
		<div id="files"></div>
		<div id="log"></div>
	</div>
	<canvas id="planet" width="320" height="320"></canvas>
</div>

<script src="index.js"></script>
<script>
const FILES = ['index.wasm', 'index.pck'];

const loader = document.getElementById('loader');
const title = document.getElementById('title');
const fill = document.getElementById('fill');
const percent = document.getElementById('percent');
const filesBox = document.getElementById('files');
const logBox = document.getElementById('log');
const hackBox = document.getElementById('hack');
const deviceBox = document.getElementById('device');
const deviceInfo = document.getElementById('deviceinfo');
const planet = document.getElementById('planet');

const info = {};

function mb(bytes) {
	return (bytes / 1048576).toFixed(1) + ' MB';
}

function log(text, isError) {
	const line = document.createElement('div');
	line.textContent = text;
	if (isError) {
		line.className = 'err';
	}
	logBox.appendChild(line);
	while (logBox.children.length > 30) {
		logBox.removeChild(logBox.firstChild);
	}
	logBox.scrollTop = logBox.scrollHeight;
}

function showError(text) {
	title.textContent = 'Something went wrong';
	log(text, true);
}

function setPercent(p) {
	p = Math.max(0, Math.min(100, p));
	fill.style.width = p + '%';
	percent.textContent = Math.round(p) + '%';
}

function updateOverall() {
	let loaded = 0;
	let total = 0;
	let allKnown = true;
	for (const name of FILES) {
		loaded += info[name].loaded;
		if (info[name].total > 0) {
			total += info[name].total;
		} else {
			allKnown = false;
		}
	}
	if (allKnown && total > 0) {
		setPercent((loaded / total) * 100);
	}
}

function makeRow(name) {
	const row = document.createElement('div');
	row.className = 'row';
	const left = document.createElement('span');
	left.textContent = name;
	const right = document.createElement('span');
	right.textContent = 'waiting';
	row.appendChild(left);
	row.appendChild(right);
	filesBox.appendChild(row);
	info[name] = { row: row, label: right, loaded: 0, total: 0 };
}

/* device text */
function detectDevice() {
	const ua = navigator.userAgent || '';
	const touch = (navigator.maxTouchPoints || 0) > 0;
	const ipad = /iPad/.test(ua) || (/Macintosh/.test(ua) && touch);
	if (ipad || /Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) {
		return 'TABLET';
	}
	if (/iPhone|iPod|Android|Mobile|Phone/i.test(ua)) {
		return 'MOBILE';
	}
	return 'DESKTOP';
}

function detectOS() {
	const ua = navigator.userAgent || '';
	if (/Android/i.test(ua)) return 'Android';
	if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
	if (/Macintosh/i.test(ua)) return (navigator.maxTouchPoints > 0) ? 'iPadOS' : 'macOS';
	if (/Windows/i.test(ua)) return 'Windows';
	if (/CrOS/i.test(ua)) return 'ChromeOS';
	if (/Linux/i.test(ua)) return 'Linux';
	return 'Unknown OS';
}

function showDevice() {
	deviceBox.textContent = detectDevice();
	deviceInfo.textContent = detectOS() + '  |  ' + screen.width + 'x' + screen.height +
		'  |  touch: ' + ((navigator.maxTouchPoints || 0) > 0 ? 'yes' : 'no');
}

/* hacker code feed */
const hackQueue = [];
const hackLines = [];
let hackBusy = false;

function hex(n, len) {
	let s = n.toString(16).toUpperCase();
	while (s.length < len) {
		s = '0' + s;
	}
	return s;
}

function hackPush(name, bytes, offset) {
	const perLine = 16;
	const maxLines = 3;
	const step = Math.max(perLine, Math.floor(bytes.length / maxLines));
	for (let i = 0; i + 1 <= bytes.length && hackQueue.length < 200; i += step) {
		let h = '';
		let a = '';
		for (let j = 0; j < perLine && i + j < bytes.length; j++) {
			const b = bytes[i + j];
			h += hex(b, 2) + ' ';
			a += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
		}
		hackQueue.push(name + ' 0x' + hex(offset + i, 8) + '  ' + h + ' |' + a + '|');
	}
	if (!hackBusy) {
		hackBusy = true;
		requestAnimationFrame(hackFlush);
	}
}

function hackFlush() {
	const rows = Math.ceil(window.innerHeight / 16) + 2;
	let count = 0;
	while (hackQueue.length > 0 && count < 6) {
		hackLines.push(hackQueue.shift());
		count++;
	}
	while (hackLines.length > rows) {
		hackLines.shift();
	}
	hackBox.textContent = hackLines.join('\n');
	if (hackQueue.length > 0) {
		requestAnimationFrame(hackFlush);
	} else {
		hackBusy = false;
	}
}

/* rotating planet */
function startPlanet() {
	const ctx = planet.getContext('2d');
	const W = planet.width;
	const R = W / 2 - 14;
	const cx = W / 2;
	const cy = W / 2;
	let rot = 0;
	let running = true;

	function ellipse(x, y, rx, ry) {
		ctx.beginPath();
		ctx.ellipse(x, y, Math.max(rx, 0.01), Math.max(ry, 0.01), 0, 0, Math.PI * 2);
		ctx.stroke();
	}

	function draw() {
		if (!running) {
			return;
		}
		ctx.clearRect(0, 0, W, W);
		ctx.strokeStyle = '#fff';
		ctx.lineWidth = 3;
		ctx.beginPath();
		ctx.arc(cx, cy, R, 0, Math.PI * 2);
		ctx.stroke();
		ctx.lineWidth = 1.5;
		for (let k = 0; k < 6; k++) {
			const a = rot + (k * Math.PI) / 6;
			ellipse(cx, cy, Math.abs(Math.cos(a)) * R, R);
		}
		for (let l = -2; l <= 2; l++) {
			const lat = (l * Math.PI) / 6;
			const rx = Math.cos(lat) * R;
			ctx.beginPath();
			ctx.ellipse(cx, cy + Math.sin(lat) * R, rx, rx * 0.2, 0, 0, Math.PI * 2);
			ctx.stroke();
		}
		rot += 0.012;
		requestAnimationFrame(draw);
	}

	draw();
	return function () {
		running = false;
	};
}

async function download(name) {
	const item = info[name];
	item.label.textContent = 'starting';
	const res = await fetch(name, { cache: 'force-cache' });
	if (!res.ok) {
		throw new Error(name + ' not found (error ' + res.status + '). Check the file name is lowercase.');
	}
	item.total = Number(res.headers.get('Content-Length')) || 0;
	const reader = res.body.getReader();
	while (true) {
		const result = await reader.read();
		if (result.done) {
			break;
		}
		hackPush(name, result.value, item.loaded);
		item.loaded += result.value.length;
		if (item.total > 0 && item.loaded > item.total) {
			item.total = item.loaded;
		}
		if (item.total > 0) {
			item.label.textContent = mb(item.loaded) + ' / ' + mb(item.total);
		} else {
			item.label.textContent = mb(item.loaded);
		}
		updateOverall();
	}
	item.total = item.loaded;
	item.label.textContent = mb(item.loaded) + ' done';
	item.row.className = 'row done';
	updateOverall();
}

async function main() {
	showDevice();
	const stopPlanet = startPlanet();

	if (typeof Engine === 'undefined') {
		showError('index.js did not load. Check that it is in the repo and named in lowercase.');
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length > 0) {
		showError('This browser cannot run the game. Missing: ' + missing.join(', '));
		return;
	}

	for (const name of FILES) {
		makeRow(name);
	}

	log('Downloading files...');
	await Promise.all(FILES.map(download));
	setPercent(100);

	title.textContent = 'Starting game...';
	log('Files downloaded, starting the engine');

	const engine = new Engine({
		executable: 'index',
		canvas: document.getElementById('canvas'),
		canvasResizePolicy: 2,
		focusCanvas: true
	});

	await engine.startGame({
		onPrint: function () {
			log(Array.prototype.slice.call(arguments).join(' '));
		},
		onPrintError: function () {
			log(Array.prototype.slice.call(arguments).join(' '), true);
		}
	});

	stopPlanet();
	loader.style.display = 'none';
}

main().catch(function (err) {
	showError(err.message);
});
</script>
</body>
</html>
