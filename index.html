<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game</title>
<!--
Changes made:
- loading screen with a progress bar and percent
- shows each file being downloaded with its size
- shows the engine messages and errors on screen so we can see why it gets stuck
- checks if the browser can run the game before loading
- NEW: detects the device (phone, tablet or computer) and sets window.isMobileDevice for the game
- NEW: add ?device=mobile or ?device=desktop to the link to force it for testing
- NEW: the device line on the loading screen was removed again
- NEW: stops the page from scrolling, zooming or opening menus while you play on a touch screen
- NEW: the page uses the real screen height on phones (100dvh)
Files must be lowercase: index.js, index.wasm, index.pck
-->
<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	background: #000;
	overflow: hidden;
	font-family: sans-serif;
	color: #fff;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}
@supports (height: 100dvh) {
	html, body {
		height: 100dvh;
	}
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
	touch-action: none;
}
#loader {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #000;
	padding: 20px;
	box-sizing: border-box;
}
#title {
	font-size: 24px;
	margin-bottom: 16px;
}
#bar {
	width: min(500px, 90%);
	height: 16px;
	background: #333;
	border-radius: 8px;
	overflow: hidden;
}
#fill {
	width: 0%;
	height: 100%;
	background: #4da3ff;
	transition: width 0.1s;
}
#percent {
	margin-top: 10px;
	font-size: 18px;
}
#files {
	margin-top: 16px;
	width: min(500px, 90%);
	font-size: 14px;
}
.row {
	display: flex;
	justify-content: space-between;
	padding: 3px 0;
	border-bottom: 1px solid #222;
}
.row.done {
	color: #6fdc6f;
}
#log {
	margin-top: 16px;
	width: min(500px, 90%);
	max-height: 120px;
	overflow: auto;
	font-size: 12px;
	color: #aaa;
	white-space: pre-wrap;
	touch-action: pan-y;
}
#log .err {
	color: #ff6b6b;
}
</style>
<script>
// finds out what device this is, the game reads window.isMobileDevice
(function () {
	var params = new URLSearchParams(window.location.search);
	var forced = params.get('device');
	var ua = navigator.userAgent || '';
	var touchPoints = navigator.maxTouchPoints || 0;
	var iPad = ua.indexOf('Macintosh') >= 0 && touchPoints > 1;
	var phoneOrTablet = /Android|iPhone|iPad|iPod|Mobi|Tablet/i.test(ua) || iPad;

	if (forced === 'mobile') {
		window.isMobileDevice = true;
		window.deviceSource = 'forced by link';
	} else if (forced === 'desktop') {
		window.isMobileDevice = false;
		window.deviceSource = 'forced by link';
	} else {
		window.isMobileDevice = phoneOrTablet;
		window.deviceSource = 'auto';
	}
	console.log('isMobileDevice:', window.isMobileDevice, '(' + window.deviceSource + ')');

	// stops the page from scrolling, zooming or opening menus while playing
	document.addEventListener('touchmove', function (e) {
		if (e.target && e.target.id === 'canvas') {
			e.preventDefault();
		}
	}, { passive: false });
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
	document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loader">
	<div id="title">Loading game...</div>
	<div id="bar"><div id="fill"></div></div>
	<div id="percent">0%</div>
	<div id="files"></div>
	<div id="log"></div>
</div>

<script src="index.js"></script>
<script>
const FILES = ['index.wasm', 'index.pck'];

const loader = document.getElementById('loader');
const title = document.getElementById('title');
const fill = document.getElementById('fill');
const percent = document.getElementById('percent');
const filesBox = document.getElementById('files');
const logBox = document.getElementById('log');

const info = {};

function mb(bytes) {
	return (bytes / 1048576).toFixed(1) + ' MB';
}

function log(text, isError) {
	const line = document.createElement('div');
	line.textContent = text;
	if (isError) {
		line.className = 'err';
	}
	logBox.appendChild(line);
	while (logBox.children.length > 30) {
		logBox.removeChild(logBox.firstChild);
	}
	logBox.scrollTop = logBox.scrollHeight;
}

function showError(text) {
	title.textContent = 'Something went wrong';
	log(text, true);
}

function setPercent(p) {
	p = Math.max(0, Math.min(100, p));
	fill.style.width = p + '%';
	percent.textContent = Math.round(p) + '%';
}

function updateOverall() {
	let loaded = 0;
	let total = 0;
	let allKnown = true;
	for (const name of FILES) {
		loaded += info[name].loaded;
		if (info[name].total > 0) {
			total += info[name].total;
		} else {
			allKnown = false;
		}
	}
	if (allKnown && total > 0) {
		setPercent((loaded / total) * 100);
	}
}

function makeRow(name) {
	const row = document.createElement('div');
	row.className = 'row';
	const left = document.createElement('span');
	left.textContent = name;
	const right = document.createElement('span');
	right.textContent = 'waiting';
	row.appendChild(left);
	row.appendChild(right);
	filesBox.appendChild(row);
	info[name] = { row: row, label: right, loaded: 0, total: 0 };
}

async function download(name) {
	const item = info[name];
	item.label.textContent = 'starting';
	const res = await fetch(name, { cache: 'force-cache' });
	if (!res.ok) {
		throw new Error(name + ' not found (error ' + res.status + '). Check the file name is lowercase.');
	}
	item.total = Number(res.headers.get('Content-Length')) || 0;
	const reader = res.body.getReader();
	while (true) {
		const result = await reader.read();
		if (result.done) {
			break;
		}
		item.loaded += result.value.length;
		if (item.total > 0 && item.loaded > item.total) {
			item.total = item.loaded;
		}
		if (item.total > 0) {
			item.label.textContent = mb(item.loaded) + ' / ' + mb(item.total);
		} else {
			item.label.textContent = mb(item.loaded);
		}
		updateOverall();
	}
	item.total = item.loaded;
	item.label.textContent = mb(item.loaded) + ' done';
	item.row.className = 'row done';
	updateOverall();
}

async function main() {
	if (typeof Engine === 'undefined') {
		showError('index.js did not load. Check that it is in the repo and named in lowercase.');
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length > 0) {
		showError('This browser cannot run the game. Missing: ' + missing.join(', '));
		return;
	}

	for (const name of FILES) {
		makeRow(name);
	}

	log('Downloading files...');
	await Promise.all(FILES.map(download));
	setPercent(100);

	title.textContent = 'Starting game...';
	log('Files downloaded, starting the engine');

	const engine = new Engine({
		executable: 'index',
		canvas: document.getElementById('canvas'),
		canvasResizePolicy: 2,
		focusCanvas: true
	});

	await engine.startGame({
		onPrint: function () {
			log(Array.prototype.slice.call(arguments).join(' '));
		},
		onPrintError: function () {
			log(Array.prototype.slice.call(arguments).join(' '), true);
		}
	});

	loader.style.display = 'none';
}

main().catch(function (err) {
	showError(err.message);
});
</script>
</body>
</html>
